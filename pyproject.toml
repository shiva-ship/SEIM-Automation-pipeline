[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siempipe"
version = "0.1.0"
description = "SIEM automation pipeline for SecurOTy: collect, normalize (ECS), enrich, detect (Sigma) and forward OT security events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
sigma = [
    "pySigma>=1.0",
    "pySigma-backend-splunk>=2.0",
    "pySigma-backend-elasticsearch>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
siempipe = "siempipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

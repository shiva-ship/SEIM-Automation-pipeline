title: SecurOTy discovered-asset inventory cleared
id: b2b05c74-7c50-4afd-9a37-a25e1445d0d2
status: experimental
description: |
    A user deleted the assets the agents discovered. This also resets the "new neighbor" baseline,
    which an attacker could use to hide a rogue device.

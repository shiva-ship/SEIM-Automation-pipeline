---
title: SecurOTy login brute force from one source
id: 4d0d977b-b880-4408-b2d6-f5844a35fd25
status: experimental
description: |
    Five or more failed logins to the SecurOTy web UI from the same source IP within five minutes.
    SecurOTy controls firmware rollout to the plant, so password guessing against it is a direct
    path to manipulating PLC and switch firmware.
author: Gruppe 3
date: 2026-11-17
tags:
    - attack.credential_access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - securoty_login_failed
    group-by:
        - source.ip
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - An operator who forgot the password after a credential rotation
level: high
